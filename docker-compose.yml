services:
  resolver:
    build: .
    container_name: failure-resolver
    command: ["python", "-m", "resolver"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      RESOLVER_MODE: agent
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      FAILURE_EVENTS_TABLE: ${FAILURE_EVENTS_TABLE:-failure_events}
      FLOW_FAILURE_RESOLUTIONS_TABLE: ${FLOW_FAILURE_RESOLUTIONS_TABLE:-flow_failure_resolutions}
      MEMORY_REPO_URL: ${MEMORY_REPO_URL:-https://github.com/bellboy-robotics/failure-resolver-database.git}
      MEMORY_REPO_BRANCH: ${MEMORY_REPO_BRANCH:-failure-resolver-dev}
      MEMORY_REPO_ROOT: ${MEMORY_REPO_ROOT:-/var/lib/failure-resolver/repository}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      GIT_ASKPASS: /app/git-askpass.sh
      GIT_TERMINAL_PROMPT: "0"
      RESOLVER_AUTO_EXECUTE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-8000}
    volumes:
      - resolver-memory:/var/lib/failure-resolver
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  resolver-memory:
