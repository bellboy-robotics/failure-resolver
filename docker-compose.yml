version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: failure-resolver-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=your-api-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build: .
    container_name: failure-resolver
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BELLBOY_API_KEY=${BELLBOY_API_KEY}
      - ROBOT_SYSID=${ROBOT_SYSID}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=sqlite:///./memory/metadata.db
      - MEMORY_DIR=./memory
      - LOG_LEVEL=INFO
    depends_on:
      - qdrant
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
