name: Deploy

on:
  push:
    branches: [failure-resolver-dev]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::905418324528:role/failure-resolver-github-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # provenance: false keeps a plain manifest — ECS rejected an OCI
      # attestation index from this repo once already.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/failure-resolver-poc:${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3

      - name: Deploy the image terraform-first
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var-file=ci.tfvars \
            -var "image_digest=${{ steps.build.outputs.digest }}"
